<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamik Foydalanuvchilar Ro'yxati</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Dinamik Foydalanuvchilar Paneli</h1>
            <p>Ma'lumotlar GitHub va lokal bazadan o'qiladi</p>
        </header>

        <!-- Qidiruv va Filtrlar paneli -->
        <div class="controls">
            <input type="text" id="search-input" class="search-input" placeholder="Ism, kasb yoki shahar bo'yicha qidirish...">
            
            <div class="category-filters" id="category-container">
                <button class="filter-btn active" data-category="all">Hammasi</button>
            </div>
        </div>

        <!-- Kartochkalar chiqadigan joy -->
        <div class="cards-grid" id="cards-grid"></div>
    </div>

    <!-- Modal Oyna -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <button id="close-modal" class="close-btn">&times;</button>
            <div class="modal-info">
                <h2 id="modal-name">F.I.O</h2>
                <p id="modal-job">Kasbi: -</p>
                <p id="modal-city">Shahar: -</p>
                <p id="modal-phone">Telefon: -</p>
                <p id="modal-email">Email: -</p>
            </div>
            
            <div class="message-section">
                <label for="user-message">Shaxsiy xabar yuborish:</label>
                <textarea id="user-message" placeholder="Xabaringizni shu yerga yozing..."></textarea>
                <button id="send-message-btn" class="send-btn">Xabarni yuborish</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
